name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      # Spec §4.2: the suite has always run on SQLite while `docker compose up`
      # deploys Postgres, so the database the project actually ships on was
      # never tested. Mirrors docker-compose.yml's `db` service exactly —
      # postgres:16, same user/password/database — so a difference this job
      # finds is a difference a deployed ley-khaa would hit.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ley
          POSTGRES_PASSWORD: ley
          POSTGRES_DB: leykhaa
        ports:
          - 5432:5432
        # The job's steps run on the runner, not inside a container, so the
        # health check is what guarantees the server is accepting connections
        # before the Postgres step opens one.
        options: >-
          --health-cmd "pg_isready -U ley -d leykhaa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
        working-directory: backend
      # "Typecheck clean" is a definition-of-done line in three of the five phase
      # specs since Phase 4 (v0.5.0) — Phases 4, 6 and 7 name it, Phases 5 and 8
      # do not — with nothing enforcing it on the backend either way: the
      # frontend's `npm run typecheck` below was the only typechecker in the
      # repo. mypy exits non-zero on any error, so this fails the build rather
      # than warning. Configuration (default settings, not --strict)
      # lives in backend/pyproject.toml. Placed before the image build because
      # it needs nothing but the pip install, so the cheap check fails fast.
      - run: python -m mypy
        working-directory: backend
      # Without the image, DockerSandbox.available() is False and every
      # [docker] param in tests/test_sandbox_contract.py skips — so the default
      # sandbox, and the §5.10 guarantees that are its whole reason to exist,
      # would have no automated coverage anywhere.
      - run: docker build -t ley-khaa-sandbox backend/sandbox
      # Two lanes over one setup, rather than a matrix: the pip install, the
      # sandbox image and mypy are identical in both, so a matrix would run all
      # of them twice to change one environment variable. The only thing a
      # matrix buys is independent results, and `if: !cancelled()` below buys
      # that for one line.
      #
      # `--database` on each step asserts which database that step actually ran
      # on, and fails the step otherwise. It is on the command line rather than
      # in `env:` deliberately: the failure worth guarding against is this
      # `env:` block being deleted or misindented, which would leave the step
      # silently re-running the SQLite lane and reporting `1066 passed` a second
      # time. A check keyed on DATABASE_URL cannot catch that — the malformation
      # removes the variable the check reads — but the `run:` line survives it.
      #
      # SQLite first: it is the fast local loop and the documented dev path
      # (backend/tests/conftest.py falls back to it whenever DATABASE_URL is
      # unset), so it stays the lane a contributor's failure is reported
      # against.
      - name: pytest (sqlite)
        run: python -m pytest -v --database=sqlite
        working-directory: backend
      # Runs even when the SQLite lane failed, so a red build says whether the
      # failure is Postgres-only — which is the entire point of having both.
      - name: pytest (postgres)
        if: ${{ !cancelled() }}
        run: python -m pytest -v --database=postgres
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://ley:ley@localhost:5432/leykhaa

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: frontend
      # `npm test` is vitest and `npm run build` is transpile-only, so without
      # this the frontend is typechecked nowhere.
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  compose-smoke:
    runs-on: ubuntu-latest
    # Spec §11's first line — "fresh clone -> docker compose up -> dashboard
    # live" — was last verified by hand at v0.1.0. A claim with a timestamp
    # rots; this is the same line as a mechanism. It runs against the checkout,
    # which is what a visitor's clone gives them.
    steps:
      - uses: actions/checkout@v4

      # No ANTHROPIC_API_KEY is set, deliberately: this is the zero-account
      # demo path a first-time visitor gets, and it must work without one.
      # `up -d` exits 0 even when the backend then crashes on startup — it
      # reports that containers were started, not that they stayed up — so
      # every assertion below is a poll, not a read of this step's exit code.
      - name: Bring the stack up
        run: docker compose up -d --build

      # Only the `db` service declares a healthcheck, so the backend and the
      # dashboard are polled here rather than waited on by compose.
      - name: Wait for the backend to answer
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "backend healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "backend did not answer /health within 60s"; exit 1

      - name: Wait for the dashboard to serve
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5173 > /dev/null; then
              echo "dashboard serving after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "dashboard did not serve within 60s"; exit 1

      # The seeded demo task LEAVING `received` is what makes this a smoke test
      # of the ORCHESTRATOR rather than of two web servers: it means the
      # crystallizer, the interpreter and the autonomy engine all ran.
      #
      # NOT "reaches done". On a fresh clone the autonomy dial parks the golden
      # conversation at `awaiting_approval` for a human, by design — the
      # project's own end-to-end test (tests/test_executor_end_to_end.py:23-26)
      # has to POST /tasks/{id}/mode {"mode":"auto"} before it can assert
      # `done`. Asserting `done` here would fail the build on a correctly
      # working stack, and making the job POST that mode itself would have CI
      # drive the workflow rather than observe it.
      #
      # The substring match is sound because TaskOut.state is a plain `str` and
      # FastAPI emits no space after the colon; verified against a live stack.
      - name: Wait for the seeded demo task to leave `received`
        run: |
          for i in $(seq 1 120); do
            body=$(curl -fsS http://localhost:8000/tasks || echo '[]')
            if [ "$body" != "[]" ] && ! echo "$body" | grep -q '"state":"received"'; then
              echo "the demo task advanced after ${i}s:"; echo "$body"; exit 0
            fi
            sleep 1
          done
          echo "the demo task did not advance within 120s; tasks were:"
          curl -fsS http://localhost:8000/tasks || true
          exit 1

      # Always runs, so a failing assertion still leaves the logs behind — the
      # only way to diagnose a compose failure after the runner is gone.
      # `sandbox-image` exiting 0 is success, not failure: it exists only to
      # build the sandbox image on the host daemon and is depended on with
      # `condition: service_completed_successfully`.
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
