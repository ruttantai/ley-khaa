name: Release images

# A version tag publishes the two images the homelab cluster deploys
# (github.com/ruttantai/homelab). Both architectures: the homelab's VMs run on
# Apple silicon (arm64); most clouds are amd64.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
            file: backend/Dockerfile
          - name: frontend
            context: frontend
            file: frontend/Dockerfile.prod
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ley-khaa-${{ matrix.name }}
          # v1.0.1 -> 1.0.1. flavor: latest=false turns off metadata-action's default
          # latest=auto, which would otherwise also push `latest`: a deployment names
          # the version it runs.
          tags: type=semver,pattern={{version}}
          flavor: latest=false
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
