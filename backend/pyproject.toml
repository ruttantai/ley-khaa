[project]
name = "ley-khaa"
version = "0.6.0"
description = "AI secretary — turns conversations into validated work"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "alembic>=1.13",
    "faker>=25",
    "openpyxl==3.1.5",
    "python-docx==1.2.0",
    "slack_sdk==3.44.0",
    "discord.py==2.7.1",
    "requests==2.34.2",
    "ollama==0.6.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "mypy==2.3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ley_khaa*"]

[tool.setuptools.package-data]
ley_khaa = [
    "fixtures/conversations/*.json",
    "alembic.ini",
    "alembic/env.py",
    "alembic/script.py.mako",
    "alembic/versions/*.py",
]

[tool.mypy]
# Default settings, deliberately not --strict (spec §4.1 decision 2): default
# already catches this codebase's real bug class, while strict is mostly
# annotation churn. Strict adoption is a post-1.0.0 item.
files = ["ley_khaa"]
python_version = "3.12"
# The third-party packages this project depends on that ship no type
# information (slack_sdk, docx, openpyxl, ollama, alembic's runtime shims).
ignore_missing_imports = true

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
    "docker: requires a Docker daemon and the ley-khaa-sandbox image",
]
