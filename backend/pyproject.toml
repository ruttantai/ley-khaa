[project]
name = "ley-khaa"
version = "0.3.0"
description = "AI secretary — turns conversations into validated work"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "alembic>=1.13",
    "faker>=25",
    "openpyxl==3.1.5",
    "python-docx==1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ley_khaa*"]

[tool.setuptools.package-data]
ley_khaa = [
    "fixtures/conversations/*.json",
    "alembic.ini",
    "alembic/env.py",
    "alembic/script.py.mako",
    "alembic/versions/*.py",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
    "docker: requires a Docker daemon and the ley-khaa-sandbox image",
]
