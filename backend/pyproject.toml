[project]
name = "ley-khaa"
version = "0.1.0"
description = "AI secretary — turns conversations into validated work"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ley_khaa*"]

[tool.setuptools.package-data]
ley_khaa = ["fixtures/conversations/*.json"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning",
]
