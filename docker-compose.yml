services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ley
      POSTGRES_PASSWORD: ley
      POSTGRES_DB: leykhaa
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ley"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ley:ley@db:5432/leykhaa
      # Without these the backend silently runs the offline HeuristicLLM stand-in
      # even for a user who has exported a key. Empty means "no key": the factory
      # falls back and says so in the log.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LEY_KHAA_LLM: ${LEY_KHAA_LLM:-anthropic}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
